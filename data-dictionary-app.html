<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Athlete 360 Integrations Data Dictionaries</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #EFEAE6;
    --panel: #FFFFFF;
    --ink: #00263A;
    --ink-soft: #51677E;
    --navy: #152969;
    --burgundy: #A6192E;
    --teal: #171FBE;
    --api-blue: #171FBE;
    --api-blue-bg: #C2DEFF;
    --derived-gold: #96690A;
    --derived-gold-bg: #FBF3E3;
    --linked-burgundy: #A6192E;
    --linked-burgundy-bg: #F6E7EA;
    --danger: #D31118;
    --line: #DED7CE;
    --line-soft: #EEE9E2;
    --radius: 3px;
    --sidebar-w: 270px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: 'Public Sans', -apple-system, sans-serif; line-height: 1.5;
    display: flex; flex-direction: column; height: 100vh; overflow: hidden;
  }
  .mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; }

  header.top {
    background: var(--panel); border-bottom: 1px solid var(--line);
    padding: 12px 20px; display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 8px; flex-shrink: 0;
  }
  .top-crumb { font-size: 13px; color: var(--ink-soft); }
  .top-left { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .top-logo { height: 34px; width: auto; flex-shrink: 0; }
  .hero-logo { display: block; height: 96px; width: auto; margin-bottom: 16px; }
  .top-crumb strong { color: var(--navy); }
  .top-crumb a { color: var(--teal); text-decoration: none; cursor: pointer; }
  .top-crumb a:hover { text-decoration: underline; }
  #signOutLink { font-size: 12.5px; color: var(--ink-soft); background: none; border: none; cursor: pointer; text-decoration: underline; }
  #signOutLink:hover { color: var(--navy); }

  .body-row { display: flex; flex: 1; min-height: 0; }

  nav.sidebar {
    width: var(--sidebar-w); flex-shrink: 0; background: var(--panel);
    border-right: 1px solid var(--line); overflow-y: auto; padding: 10px 12px 24px;
  }

  .home-link {
    display: flex; align-items: center; gap: 8px; padding: 9px 8px; margin-bottom: 8px;
    border-radius: var(--radius); cursor: pointer; font-size: 13.5px; font-weight: 600; color: var(--navy);
    border-bottom: 1px solid var(--line);
  }
  .home-link:hover { background: #F5F6F8; }
  .home-link.active { background: #E7ECF3; box-shadow: inset 3px 0 0 var(--burgundy); }

  .sensor-group { margin-bottom: 4px; margin-top: 8px; }
  .sensor-head {
    display: flex; align-items: center; justify-content: space-between; gap: 6px;
    padding: 8px 8px; cursor: pointer; border-radius: var(--radius); user-select: none;
  }
  .sensor-head:hover { background: #F5F6F8; }
  .sensor-head-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .sensor-name { font-size: 13.5px; font-weight: 600; color: var(--navy); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sensor-chevron {
    width: 7px; height: 7px; border-right: 1.5px solid var(--ink-soft); border-bottom: 1.5px solid var(--ink-soft);
    transform: rotate(45deg); transition: transform 0.15s ease; flex-shrink: 0;
  }
  .sensor-group.collapsed .sensor-chevron { transform: rotate(-45deg); }
  .sensor-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .icon-btn { font-size: 12px; line-height: 1; background: none; border: none; color: var(--ink-soft); cursor: pointer; padding: 2px 3px; }
  .icon-btn:hover { color: var(--navy); }
  .icon-btn.danger:hover { color: var(--danger); }

  .form-list { list-style: none; margin: 2px 0 6px; padding: 0 0 0 18px; }
  .sensor-group.collapsed .form-list { display: none; }
  .form-item {
    display: flex; align-items: center; justify-content: space-between; gap: 6px;
    padding: 7px 8px; border-radius: var(--radius); cursor: pointer; font-size: 13px; color: var(--ink-soft);
  }
  .form-item:hover { background: #F5F6F8; color: var(--ink); }
  .form-item.active { background: #E7ECF3; color: var(--navy); font-weight: 600; }
  .form-item-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .add-inline {
    font-family: 'Public Sans', sans-serif; font-size: 12.5px; padding: 6px 8px;
    border: 1px dashed var(--line); background: transparent; color: var(--ink-soft);
    border-radius: var(--radius); cursor: pointer; width: 100%; text-align: left; margin-top: 4px;
  }
  .add-inline:hover { border-color: var(--teal); color: var(--teal); }

  main.content { flex: 1; min-width: 0; overflow-y: auto; }
  .page { max-width: 900px; margin: 0 auto; padding: 28px 24px 80px; }

  /* Landing / directions page */
  .home-hero h1 {
    font-size: 24px; color: var(--navy); margin: 0 0 10px;
    padding-bottom: 12px; border-bottom: 3px solid var(--burgundy); display: inline-block;
  }
  .home-hero p.lead { font-size: 14px; color: var(--ink-soft); margin: 0 0 24px; max-width: 640px; }

  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; margin-bottom: 16px; }
  .panel h2 { font-size: 14px; color: var(--navy); margin: 0 0 10px; }
  .panel p { font-size: 13.5px; color: var(--ink-soft); margin: 0 0 12px; }
  .panel ol, .panel ul { font-size: 13.5px; color: var(--ink-soft); margin: 0 0 12px; padding-left: 20px; }
  .panel li { margin-bottom: 4px; }

  .status-pill {
    display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; padding: 5px 10px;
    border-radius: 999px; border: 1px solid var(--line); color: var(--ink-soft); margin-bottom: 14px;
  }
  .status-pill.on { border-color: var(--teal); color: var(--teal); background: #EEF6F5; }
  .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-soft); }
  .status-pill.on .status-dot { background: var(--teal); }

  button.action {
    font-family: 'Public Sans', sans-serif; font-size: 13px; padding: 8px 12px;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink-soft);
    border-radius: var(--radius); cursor: pointer;
  }
  button.action:hover { border-color: var(--navy); color: var(--navy); }
  button.action[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: #fff; }
  button.action-team { border-color: var(--teal); color: var(--teal); }
  button.action-team:hover { background: var(--teal); color: #fff; }
  button.action-danger { color: var(--danger); border-color: #EBC9C6; }
  button.action-danger:hover { border-color: var(--danger); background: #FBEEEC; }

  .btn-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  #csvUploadInput, #jsonImportInput { display: none; }

  /* Form dashboard page */
  .form-toolbar { display: flex; gap: 10px; margin-bottom: 4px; flex-wrap: wrap; align-items: center; }
  .form-toolbar input[type="search"], .form-toolbar select {
    font-family: 'Public Sans', sans-serif; font-size: 13.5px; padding: 8px 10px;
    border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); color: var(--ink);
  }
  .form-toolbar input[type="search"] { flex: 1 1 220px; min-width: 160px; }
  .team-toolbar-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 10px 0 4px; }
  .ctrl-divider { width: 1px; height: 20px; background: var(--line); margin: 0 2px; }

  .form-header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
  .form-header h1 { font-size: 20px; margin: 0; color: var(--navy); }
  .form-header .subtitle { font-size: 13px; color: var(--ink-soft); margin: 2px 0 0; }
  .counts { font-size: 12.5px; color: var(--ink-soft); white-space: nowrap; }
  .counts .mono { color: var(--navy); font-weight: 500; }

  .legend { display: flex; gap: 14px; align-items: center; font-size: 12px; color: var(--ink-soft); margin: 10px 0 4px; flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-swatch { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }

  .edit-hint { margin: 10px 0 14px; font-size: 12.5px; color: var(--teal); background: #EEF6F5; border: 1px solid #CFE3E1; border-radius: var(--radius); padding: 7px 10px; }

  [contenteditable="true"] { cursor: text; border-radius: 2px; }
  body.edit-mode [contenteditable="true"] { outline: 1px dashed #9FB6C4; outline-offset: 3px; background: #FBFCFD; }
  body.edit-mode [contenteditable="true"]:hover { outline-color: var(--teal); }
  body.edit-mode [contenteditable="true"]:focus { outline: 1.5px solid var(--teal); background: #fff; }

  .section-block { margin-top: 30px; }
  .section-block:first-of-type { margin-top: 18px; }
  .section-heading-row {
    list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between;
    padding: 6px 2px; margin-bottom: 10px; border-bottom: 1px solid var(--line);
  }
  .section-heading-row::-webkit-details-marker { display: none; }
  .section-heading-row:hover .section-heading { color: var(--teal); }
  .section-chevron { margin-right: 8px; }
  .section-heading { font-size: 12.5px; font-weight: 600; color: var(--navy); text-transform: uppercase; letter-spacing: 0.06em; }
  .section-remove { font-size: 11.5px; color: var(--danger); background: none; border: none; cursor: pointer; opacity: 0.7; }
  .section-remove:hover { opacity: 1; text-decoration: underline; }
  .add-field-row { margin-top: 8px; }
  .page-add-section { margin-top: 30px; }

  details.field { background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--api-blue); border-radius: var(--radius); margin-bottom: 8px; overflow: hidden; }
  details.field[data-origin="derived"] { border-left-color: var(--derived-gold); }
  details.field[data-origin="linked"] { border-left-color: var(--linked-burgundy); }
  summary.field-summary { list-style: none; cursor: pointer; padding: 13px 16px; display: flex; align-items: center; gap: 12px; justify-content: space-between; }
  summary.field-summary::-webkit-details-marker { display: none; }
  .summary-left { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
  .field-name { font-weight: 600; font-size: 15px; color: var(--ink); white-space: nowrap; }
  .field-type-tag { font-size: 11.5px; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .summary-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }

  .origin-badge {
    font-size: 10.5px; font-weight: 600; letter-spacing: 0.03em; padding: 2px 7px; border-radius: 999px;
    color: var(--api-blue); background: var(--api-blue-bg); white-space: nowrap;
  }
  .origin-badge[data-origin="derived"] { color: var(--derived-gold); background: var(--derived-gold-bg); }
  .origin-badge[data-origin="linked"] { color: var(--linked-burgundy); background: var(--linked-burgundy-bg); }
  button.origin-badge { border: none; cursor: pointer; font-family: 'Public Sans', sans-serif; }
  body.edit-mode button.origin-badge { outline: 1px dashed currentColor; outline-offset: 1px; }

  .field-remove { font-size: 15px; line-height: 1; color: var(--ink-soft); background: none; border: none; cursor: pointer; padding: 0 2px; }
  .field-remove:hover { color: var(--danger); }
  .chevron { width: 9px; height: 9px; border-right: 1.5px solid var(--ink-soft); border-bottom: 1.5px solid var(--ink-soft); transform: rotate(-45deg); transition: transform 0.15s ease; margin-right: 2px; }
  details[open] .chevron { transform: rotate(45deg); }
  .field-body { padding: 4px 16px 16px; border-top: 1px solid var(--line-soft); }
  .spec-row { display: grid; grid-template-columns: 160px 1fr; gap: 4px 16px; padding: 10px 0; border-bottom: 1px solid var(--line-soft); }
  .spec-row:last-of-type { border-bottom: none; }
  .spec-label { font-size: 11.5px; color: var(--teal); padding-top: 1px; }
  .spec-value { font-size: 13.5px; color: var(--ink); }
  .spec-value:empty::before { content: '—'; color: #A8B3BC; }
  .spec-value.vetting { white-space: pre-wrap; min-height: 44px; line-height: 1.5; }
  .empty-state { text-align: center; padding: 60px 20px; color: var(--ink-soft); font-size: 14px; }

  .grid-col-count { font-size: 11.5px; color: var(--ink-soft); white-space: nowrap; }
  .grid-preview-wrap { overflow-x: auto; margin: 6px 0 18px; border: 1px solid var(--line-soft); border-radius: var(--radius); }
  table.grid-preview { border-collapse: collapse; width: 100%; min-width: 420px; }
  table.grid-preview th, table.grid-preview td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line-soft); white-space: nowrap; }
  table.grid-preview th { background: #F5F8F8; font-size: 12.5px; font-weight: 600; color: var(--teal); border-bottom: 1px solid var(--line); }
  table.grid-preview td { font-size: 13.5px; color: var(--ink-soft); }
  table.grid-preview tbody tr:last-child td { border-bottom: none; }
  .grid-sample-note { font-size: 11.5px; color: var(--ink-soft); font-style: italic; margin: -10px 0 18px; }
  .grid-columns-label { font-size: 12px; font-weight: 600; color: var(--ink-soft); margin: 4px 0 8px; }
  details.subfield { border: 1px solid var(--line-soft); border-left: 2px solid var(--line); border-radius: var(--radius); margin-bottom: 6px; background: #FCFDFD; }
  summary.subfield-summary { list-style: none; cursor: pointer; padding: 9px 12px; display: flex; align-items: center; gap: 10px; justify-content: space-between; }
  summary.subfield-summary::-webkit-details-marker { display: none; }
  .subfield-summary .field-name { font-size: 13.5px; }
  .subfield-summary .chevron { width: 7px; height: 7px; }
  .subfield-body { padding: 2px 14px 12px; border-top: 1px solid var(--line-soft); }
  .subfield-body .spec-row { grid-template-columns: 140px 1fr; padding: 8px 0; }

  footer.notes { max-width: 900px; margin: 20px auto 40px; padding: 0 24px; font-size: 12.5px; color: var(--ink-soft); border-top: 1px solid var(--line); padding-top: 14px; }
  footer.notes p { margin: 0 0 8px; }

  @media (max-width: 560px) {
    .spec-row { grid-template-columns: 1fr; }
    .field-type-tag { display: none; }
  }
</style>
</head>

        if (parsed && Array.isArray(parsed.sensors)) { loadedFrom = 'published'; return parsed; }

  function parseCsvText(text) {

    let row = [], field = '', inQuotes = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (inQuotes) {
        if (c === '"') {
          if (text[i + 1] === '"') { field += '"'; i++; }
          else inQuotes = false;
        } else {
          field += c;
        }
      } else if (c === '"') {

      } else if (c === ',') {

  function wireAdminPanel() {
    document.getElementById('btnDownloadTemplate').addEventListener('click', downloadCsvTemplate);

    document.getElementById('csvUploadInput').addEventListener('change', handleCsvUpload);
    document.getElementById('btnExportAll').addEventListener('click', exportAllData);
    document.getElementById('btnImportAll').addEventListener('click', () => document.getElementById('jsonImportInput').click());
    document.getElementById('jsonImportInput').addEventListener('change', handleJsonImport);

  function downloadCsvTemplate() {
    const rows = [
      CSV_HEADERS,
      ['Whoop', 'Whoop Recovery Summary', 'New Section', '', 'Recovery Score', 'API', 'Single-line number box', 'Numeric (0-100)', '%', 'Overall recovery score for the day', 'N/A', '', 'v1.0 - [date] - Initial documentation.', ''],
      ['Whoop', 'Whoop Recovery Summary', 'HRV Samples', 'HRV Reading', 'Time of Reading', 'API', 'Grid column, one row per sample', 'Time', 'Time', 'Timestamp of the HRV sample', 'N/A', '', 'v1.0 - [date] - Initial documentation.', '6:14 AM'],
      ['Whoop', 'Whoop Recovery Summary', 'HRV Samples', 'HRV Reading', 'HRV (ms)', 'API', 'Grid column, numeric value per row', 'Numeric', 'ms', 'Heart rate variability reading in milliseconds', 'N/A', '', 'v1.0 - [date] - Initial documentation.', '62'],
      ['Whoop', 'Whoop Recovery Summary', 'New Section', '', 'Recovery Trend (7-day)', 'Derived', 'Calculated, no direct input', 'Numeric', 'points', '7-day rolling average of Recovery Score, added for trend reporting', 'Average of the last 7 daily Recovery Score values', 'Verify the averaging window with whoever built this.', 'v1.0 - [date] - Initial documentation.', ''],
      ['Whoop', 'Whoop Recovery Summary', 'New Section', '', 'Athlete Sport', 'Linked', 'Not entered on this form - pulled in from the athlete profile.', 'Text', 'N/A', 'Linked profile information showing the athlete\'s primary sport.', 'N/A', '', 'v1.0 - [date] - Initial documentation.', ''],
    ];
    const csv = unparseCsv(rows);
    const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'data-dictionary-upload-template.csv';
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  }

  function parseOrigin(value) {
    const v = (value || '').trim();
    if (/^d/i.test(v)) return 'derived';
    if (/^l/i.test(v)) return 'linked';
    return 'api';
  }

  function groupCsvRowsIntoForm(rows) {
    const sections = [];
    const fields = [];
    const gridsByKey = new Map();

    rows.forEach(row => {
      const sectionName = (row['Section'] || 'New Section').trim();
      if (!sections.includes(sectionName)) sections.push(sectionName);

      const tableName = (row['Table'] || '').trim();
      const id = newId('field');
      const origin = parseOrigin(row['Field Origin (API/Derived/Linked)']);
      const field = {
        id,
        section: sectionName,
        name: (row['Field Name'] || 'Untitled field').trim(),
        instructions: row['Field Instructions'] || '',
        type: row['Field Type'] || '',
        units: row['Units'] || '',
        definition: row['Definition / Purpose'] || '',
        calc: row['Calculation / Logic'] || '',
        internalVetting: row['Internal Vetting'] || '',
        changelog: row['Version / Change Log'] || '',
        origin,
        gridId: null,
        gridColIndex: null,
      };

      if (tableName) {
        const gridKey = sectionName + '::' + tableName;
        if (!gridsByKey.has(gridKey)) {
          gridsByKey.set(gridKey, {
            id: newId('grid'), label: tableName, section: sectionName,
            columnIds: [], sample: [], sampleNote: '', origin,
          });
        }
        const grid = gridsByKey.get(gridKey);
        field.gridId = grid.id;
        field.gridColIndex = grid.columnIds.length;
        grid.columnIds.push(id);
        grid.sample.push(row['Sample Value (for table columns)'] || '');
      }

      fields.push(field);
    });

    return { fields, grids: [...gridsByKey.values()], sections };
  }

  function handleCsvUpload(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const rows = parseCsvText(String(reader.result));
        const objects = csvRowsToObjects(rows);
        importCsvRows(objects);
      } catch (err) {
        alert('Could not read that file as a data-dictionary CSV: ' + err.message);
      }
    };
    reader.onerror = () => alert('Could not read that file.');
    reader.readAsText(file);
    e.target.value = '';
  }

  function importCsvRows(rows) {
    if (!rows.length) { alert('That file had no rows to import.'); return; }
    const bySensorForm = new Map();
    rows.forEach(row => {
      const sensorName = (row['Sensor'] || '').trim();
      const formName = (row['Form'] || '').trim();
      if (!sensorName || !formName) return;
      const key = sensorName + '::' + formName;
      if (!bySensorForm.has(key)) bySensorForm.set(key, { sensorName, formName, rows: [] });
      bySensorForm.get(key).rows.push(row);
    });

    if (bySensorForm.size === 0) {
      alert('No rows had both a Sensor and a Form value — nothing to import.');
      return;
    }

    let importedCount = 0;
    bySensorForm.forEach(({ sensorName, formName, rows }) => {
      let sensor = APP.sensors.find(s => s.name.toLowerCase() === sensorName.toLowerCase());
      if (!sensor) {
        sensor = { id: newId('sensor'), name: sensorName, forms: [] };
        APP.sensors.push(sensor);
      }
      let form = sensor.forms.find(f => f.name.toLowerCase() === formName.toLowerCase());
      const built = groupCsvRowsIntoForm(rows);
      if (form) {
        if (!confirm(`"${formName}" already exists under ${sensorName} with ${form.fields.length} field(s). Replace its contents with the ${built.fields.length} field(s) from this upload?`)) {
          return;
        }
        form.fields = built.fields;
        form.grids = built.grids;
        form.sections = built.sections;
      } else {
        form = {
          id: newId('form'), name: formName, subtitle: 'Data dictionary',
          sourceNote: 'Uploaded from a data-dictionary CSV.',
          fields: built.fields, grids: built.grids, sections: built.sections,
        };
        sensor.forms.push(form);
      }
      importedCount++;
    });

    persist();
    renderAll();
    if (importedCount > 0) alert(`Imported ${importedCount} form(s) from that file.`);
  }

  function exportAllData() {
    const blob = new Blob([JSON.stringify(APP, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = DATA_FILE;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  }

  function handleJsonImport(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        if (!parsed || !Array.isArray(parsed.sensors)) throw new Error('This file is not a data-dictionary export.');
        if (confirm('Replace everything in this app with the imported file? This overwrites all sensors and forms currently shown.')) {
          APP = parsed;
          view = { type: 'home' };
          persist();
          renderAll();
        }
      } catch (err) {
        alert('Could not import that file: ' + err.message);
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  }

  // ---------- Form dashboard page ----------
  function rerenderForm() { contentEl.innerHTML = ''; renderFormPage(); }

  function renderFormPage() {
    const found = findForm(view.formId);
    if (!found) { goHome(); return; }
    const form = found.form;

    const wrap = document.createElement('div');
    wrap.className = 'page';

    const total = form.fields.length;

    wrap.innerHTML = `
      <div class="form-header">
        <div>
          <h1>${escapeHtml(form.name)}</h1>
          <p class="subtitle">${escapeHtml(form.subtitle || '')}</p>
        </div>
        <div class="counts">
          <span id="visibleCount" class="mono">${total}</span> of <span class="mono">${total}</span> fields
        </div>
      </div>
      <div class="form-toolbar">
        <input type="search" id="searchInput" placeholder="Search fields, definitions, types…" aria-label="Search fields">
        <select id="sectionFilter" aria-label="Filter by section"><option value="">All sections</option></select>
        <button class="action" id="expandAll">Expand all</button>
        <button class="action" id="collapseAll">Collapse all</button>
      </div>
      <div class="legend">
        <span class="legend-item"><span class="legend-swatch" style="background: var(--api-blue);"></span>API-offered field</span>
        <span class="legend-item"><span class="legend-swatch" style="background: var(--derived-gold);"></span>Derived field / added calculation</span>
        <span class="legend-item"><span class="legend-swatch" style="background: var(--linked-burgundy);"></span>Linked field - linked profile or event information</span>
      </div>
      ${teamMode ? `
      <div class="team-toolbar-row">
        <button class="action" id="editModeToggle">${editMode ? 'Done editing' : 'Edit content'}</button>
        <button class="action" id="exportFormCsv" title="Download this form's fields as CSV, e.g. for bulk editing in Excel">Export as CSV</button>
        <button class="action action-danger" id="resetFormEdits" title="Discard local edits and restore this form to its last-imported state">Reset this form</button>
      </div>
      <p class="edit-hint" id="editHint" ${editMode ? '' : 'hidden'}>Editing on — click any field name or value to change it, or use "+ Add field" / "+ Add section" / "+ Add table" below. Click a field's origin badge to cycle API / Derived / Linked.</p>
      ` : ''}
      <div id="fieldsArea"></div>
      <footer class="notes">
        <p><strong style="color: var(--ink);">Source:</strong> ${escapeHtml(form.sourceNote || '')}</p>
      </footer>
    `;
    contentEl.appendChild(wrap);

    const searchInput = document.getElementById('searchInput');
    const sectionFilter = document.getElementById('sectionFilter');
    const fieldsArea = document.getElementById('fieldsArea');
    const visibleCountEl = document.getElementById('visibleCount');

    form.sections.forEach(s => {
      const opt = document.createElement('option');
      opt.value = s; opt.textContent = s;
      sectionFilter.appendChild(opt);
    });

    function fieldMatches(field, query) {
      if (!query) return true;
      const haystack = (field.name + ' ' + field.definition + ' ' + field.type + ' ' + field.instructions).toLowerCase();
      return haystack.includes(query);
    }
    function fieldById(id) { return form.fields.find(f => f.id === id); }

    function renderFields() {
      const query = searchInput.value.trim().toLowerCase();
      const sectionVal = sectionFilter.value;

      const openState = {};
      fieldsArea.querySelectorAll('[data-open-key]').forEach(d => { openState[d.dataset.openKey] = d.open; });

      fieldsArea.innerHTML = '';
      let visible = 0;
      const editable = (teamMode && editMode) ? 'true' : 'false';

      form.sections.forEach(sectionName => {
        if (sectionVal && sectionVal !== sectionName) return;

        const items = [];
        form.fields.filter(f => f.section === sectionName).forEach(f => {
          if (f.gridId) {
            if (!items.find(it => it.type === 'grid' && it.gridId === f.gridId)) items.push({ type: 'grid', gridId: f.gridId });
          } else {
            items.push({ type: 'field', field: f });
          }
        });

        const visibleItems = [];
        items.forEach(item => {
          if (item.type === 'field') {
            const f = item.field;
            if (!fieldMatches(f, query)) return;
            visibleItems.push(item);
          } else {
            const grid = form.grids.find(g => g.id === item.gridId);
            const cols = grid.columnIds.map(fieldById).filter(Boolean);
            const gridMatchesQuery = cols.some(c => fieldMatches(c, query));
            if (!gridMatchesQuery) return;
            visibleItems.push({ type: 'grid', grid, cols });
          }
        });

        if (visibleItems.length === 0 && !(teamMode && editMode && !query && !sectionVal)) return;

        const AUTO_COLLAPSED_SECTIONS = ['User Account Details', 'Day of the Week', 'Profile'];
        const filtersActive = !!(query || sectionVal);
        const memKey = form.id + '::' + sectionName;
        const wasToggled = Object.prototype.hasOwnProperty.call(sectionOpenMemory, memKey);
        const sectionOpen = filtersActive
          ? true
          : (wasToggled ? sectionOpenMemory[memKey] : !AUTO_COLLAPSED_SECTIONS.includes(sectionName));

        const block = document.createElement('details');
        block.className = 'section-block';
        block.dataset.openKey = sectionName;
        if (sectionOpen) block.open = true;
        block.addEventListener('toggle', () => {
          if (filtersActive) return; // don't memorize a state that was forced open by search/section-filter
          sectionOpenMemory[memKey] = block.open;
        });
        const headRow = document.createElement('summary');
        headRow.className = 'section-heading-row';
        headRow.innerHTML = `
          <span class="summary-left"><span class="chevron section-chevron"></span><span class="section-heading">${escapeHtml(sectionName)}</span></span>
          ${(teamMode && editMode) ? `<button class="section-remove" data-remove-section="${escapeHtml(sectionName)}">Remove section</button>` : ''}
        `;
        block.appendChild(headRow);

        visibleItems.forEach(item => {
          visible += item.type === 'field' ? 1 : item.cols.length;
          if (item.type === 'field') block.appendChild(buildFieldCard(item.field, editable, openState));
          else block.appendChild(buildGridCard(item.grid, item.cols, editable, openState));
        });

        if (teamMode && editMode) {
          const addRow = document.createElement('div');
          addRow.className = 'add-field-row';
          addRow.innerHTML = `
            <div style="display:flex; gap:8px;">
              <button class="add-inline" data-add-field-to="${escapeHtml(sectionName)}">+ Add field to "${escapeHtml(sectionName)}"</button>
              <button class="add-inline" data-add-table-to="${escapeHtml(sectionName)}">+ Add table to "${escapeHtml(sectionName)}"</button>
            </div>
          `;
          block.appendChild(addRow);
        }

        fieldsArea.appendChild(block);
      });

      if (teamMode && editMode) {
        const addSection = document.createElement('div');
        addSection.className = 'page-add-section';
        addSection.innerHTML = `<button class="add-inline" id="addSectionBtn">+ Add section</button>`;
        fieldsArea.appendChild(addSection);
      }

      visibleCountEl.textContent = visible;
      if (fieldsArea.children.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'empty-state';
        empty.textContent = 'No fields match the current filters.';
        fieldsArea.appendChild(empty);
      }

      if (focusFieldId) {
        const el = fieldsArea.querySelector(`[data-role="name"][data-id="${focusFieldId}"]`);
        if (el) {
          const details = el.closest('details');
          if (details) details.open = true;
          el.focus();
          const range = document.createRange();
          range.selectNodeContents(el);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
        }
        focusFieldId = null;
      }
    }

    function fieldSpecRows(field, editable) {
      return `
        ${specRow('Field instructions', field.instructions, 'instructions', field.id, editable)}
        ${specRow('Field type', field.type, 'type', field.id, editable, true)}
        ${specRow('Units', field.units, 'units', field.id, editable, true)}
        ${specRow('Definition / purpose', field.definition, 'definition', field.id, editable)}
        ${specRow('Calculation / logic', field.calc, 'calc', field.id, editable)}
        ${specRow('Internal vetting', field.internalVetting, 'internalVetting', field.id, editable, false, true)}
        ${specRow('Version / change log', field.changelog, 'changelog', field.id, editable)}
      `;
    }
    function specRow(label, value, key, fieldId, editable, mono, vetting) {
      return `
        <div class="spec-row">
          <div class="spec-label">${label}</div>
          <div class="spec-value ${mono ? 'mono' : ''} ${vetting ? 'vetting' : ''}" data-role="spec" data-key="${key}" data-id="${fieldId}" contenteditable="${editable}">${escapeHtml(value)}</div>
        </div>
      `;
    }
    function originBadge(origin, id, isGrid, editable) {
      const tag = editable === 'true' ? 'button' : 'span';
      const attrs = editable === 'true'
        ? `data-toggle-origin="${id}" data-is-grid="${isGrid ? '1' : '0'}" type="button"`
        : '';
      const label = origin === 'derived' ? 'Derived' : (origin === 'linked' ? 'Linked' : 'API');
      return `<${tag} class="origin-badge" data-origin="${origin}" ${attrs}>${label}</${tag}>`;
    }
    function buildFieldCard(field, editable, openState) {
      const details = document.createElement('details');
      details.className = 'field';
      details.dataset.origin = field.origin;
      details.dataset.openKey = field.id;
      if (openState[field.id]) details.open = true;
      details.innerHTML = `
        <summary class="field-summary">
          <div class="summary-left">
            <span class="chevron"></span>
            <span class="field-name" data-role="name" data-id="${field.id}" contenteditable="${editable}">${escapeHtml(field.name)}</span>
          </div>
          <div class="summary-right">
            <span class="field-type-tag mono">${escapeHtml(field.type)}</span>
            ${originBadge(field.origin, field.id, false, editable)}
            ${editable === 'true' ? `<button class="field-remove" data-remove-field="${field.id}" title="Delete this field">×</button>` : ''}
          </div>
        </summary>
        <div class="field-body">${fieldSpecRows(field, editable)}</div>
      `;
      return details;
    }
    function buildGridCard(grid, cols, editable, openState) {
      const details = document.createElement('details');
      details.className = 'field';
      details.dataset.grid = 'true';
      details.dataset.origin = grid.origin;
      details.dataset.openKey = grid.id;
      if (openState[grid.id]) details.open = true;
      const headerCells = cols.map(c => `<th data-role="name" data-id="${c.id}" contenteditable="${editable}">${escapeHtml(c.name)}</th>`).join('');
      const sampleCells = grid.sample.map((val, i) => `<td data-role="gridSample" data-grid-id="${grid.id}" data-col-index="${i}" contenteditable="${editable}">${escapeHtml(val)}</td>`).join('');
      const subfields = cols.map(c => `
        <details class="subfield" data-open-key="${c.id}" ${openState[c.id] ? 'open' : ''}>
          <summary class="subfield-summary">
            <div class="summary-left"><span class="chevron"></span><span class="field-name">${escapeHtml(c.name)}</span></div>
            <div class="summary-right">
              <span class="field-type-tag mono">${escapeHtml(c.type)}</span>
            </div>
          </summary>
          <div class="subfield-body">${fieldSpecRows(c, editable)}</div>
        </details>
      `).join('');
      details.innerHTML = `
        <summary class="field-summary">
          <div class="summary-left">
            <span class="chevron"></span>
            <span class="field-name">${escapeHtml(grid.label)} <span class="grid-col-count">(table — ${cols.length} columns)</span></span>
          </div>
          <div class="summary-right">
            ${originBadge(grid.origin, grid.id, true, editable)}
            ${editable === 'true' ? `<button class="field-remove" data-remove-grid="${grid.id}" title="Delete this table">×</button>` : ''}
          </div>
        </summary>
        <div class="field-body">
          <div class="grid-columns-label">How the columns line up</div>
          <div class="grid-preview-wrap"><table class="grid-preview"><thead><tr>${headerCells}</tr></thead><tbody><tr>${sampleCells}</tr></tbody></table></div>
          ${grid.sampleNote ? `<div class="grid-sample-note">${escapeHtml(grid.sampleNote)}</div>` : ''}
          <div class="grid-columns-label">Column definitions</div>
          ${subfields}
        </div>
      `;
      return details;
    }

    searchInput.addEventListener('input', renderFields);
    sectionFilter.addEventListener('change', renderFields);
    document.getElementById('expandAll').addEventListener('click', () => {
      fieldsArea.querySelectorAll('details').forEach(d => d.open = true);
    });
    document.getElementById('collapseAll').addEventListener('click', () => {
      fieldsArea.querySelectorAll('details.field, details.section-block').forEach(d => d.open = false);
    });

    if (teamMode) {
      document.getElementById('editModeToggle').addEventListener('click', () => {
        editMode = !editMode;
        document.body.classList.toggle('edit-mode', editMode);
        rerenderForm();
      });
      document.getElementById('exportFormCsv').addEventListener('click', () => exportFormCsv(found.sensor, form));
      document.getElementById('resetFormEdits').addEventListener('click', () => {
        const seedFound = (function findInSeed() {
          for (const s of SEED_APP.sensors) { const f = s.forms.find(x => x.id === form.id); if (f) return f; }
          return null;
        })();
        if (!seedFound) { alert('This form has no original version to reset to (it was created in this app, not part of the original seed data).'); return; }
        if (!confirm('Discard edits to this form and restore its original content?')) return;
        Object.assign(form, JSON.parse(JSON.stringify(seedFound)));
        persist();
        rerenderForm();
      });
    }

    fieldsArea.addEventListener('click', (e) => {
      if (editMode && (e.target.closest('[data-role="name"]') || e.target.closest('[data-role="gridSample"]'))) {
        e.preventDefault();
      }

      const originBtn = e.target.closest('[data-toggle-origin]');
      if (originBtn) {
        e.preventDefault();
        const id = originBtn.dataset.toggleOrigin;
        const nextOrigin = (o) => (o === 'api' ? 'derived' : (o === 'derived' ? 'linked' : 'api'));
        if (originBtn.dataset.isGrid === '1') {
          const grid = form.grids.find(g => g.id === id);
          if (grid) grid.origin = nextOrigin(grid.origin);
        } else {
          const f = fieldById(id);
          if (f) f.origin = nextOrigin(f.origin);
        }
        persist(); renderFields();
        return;
      }

      const removeFieldBtn = e.target.closest('[data-remove-field]');
      if (removeFieldBtn) {
        e.preventDefault();
        const f = fieldById(removeFieldBtn.dataset.removeField);
        if (f && confirm(`Delete the field "${f.name}"? This can't be undone.`)) {
          form.fields = form.fields.filter(x => x.id !== f.id);
          persist(); renderFields();
        }
        return;
      }
      const removeGridBtn = e.target.closest('[data-remove-grid]');
      if (removeGridBtn) {
        e.preventDefault();
        const grid = form.grids.find(g => g.id === removeGridBtn.dataset.removeGrid);
        if (grid && confirm(`Delete the table "${grid.label}" and all ${grid.columnIds.length} of its columns? This can't be undone.`)) {
          form.fields = form.fields.filter(f => f.gridId !== grid.id);
          form.grids = form.grids.filter(g => g.id !== grid.id);
          persist(); renderFields();
        }
        return;
      }
      const addFieldBtn = e.target.closest('[data-add-field-to]');
      if (addFieldBtn) {
        const section = addFieldBtn.dataset.addFieldTo;
        const id = newId('field');
        form.fields.push({ id, section, name: 'New field', instructions: '', type: '', units: '', definition: '', calc: '', internalVetting: '', changelog: '', origin: 'api', gridId: null, gridColIndex: null });
        focusFieldId = id;
        persist(); renderFields();
        return;
      }
      const addTableBtn = e.target.closest('[data-add-table-to]');
      if (addTableBtn) {
        const section = addTableBtn.dataset.addTableTo;
        const label = prompt('Name this table (e.g. "HRV Samples"):');
        if (!label) return;
        const colsInput = prompt('Column names, separated by commas (e.g. "Time of Reading, HRV (ms)"):');
        if (!colsInput) return;
        const colNames = colsInput.split(',').map(s => s.trim()).filter(Boolean);
        if (colNames.length < 2) { alert('A table needs at least 2 columns.'); return; }
        const sampleInput = prompt('Optional: one example value per column, comma-separated, in the same order (for illustration only — leave blank to skip):', '');
        const sampleVals = sampleInput ? sampleInput.split(',').map(s => s.trim()) : [];
        const gridId = newId('grid');
        const columnIds = [];
        colNames.forEach((name, i) => {
          const id = newId('field');
          form.fields.push({ id, section, name, instructions: '', type: '', units: '', definition: '', calc: '', internalVetting: '', changelog: '', origin: 'api', gridId, gridColIndex: i });
          columnIds.push(id);
        });
        form.grids.push({ id: gridId, label, section, columnIds, sample: colNames.map((_, i) => sampleVals[i] || ''), sampleNote: sampleVals.length ? '' : 'No example values provided yet.', origin: 'api' });
        persist(); renderFields();
        return;
      }
      const removeSectionBtn = e.target.closest('[data-remove-section]');
      if (removeSectionBtn) {
        e.preventDefault();
        const name = removeSectionBtn.dataset.removeSection;
        if (confirm(`Delete the section "${name}" and everything in it? This can't be undone.`)) {
          const gridIdsInSection = new Set(form.fields.filter(f => f.section === name && f.gridId).map(f => f.gridId));
          form.fields = form.fields.filter(f => f.section !== name);
          form.grids = form.grids.filter(g => !gridIdsInSection.has(g.id));
          form.sections = form.sections.filter(s => s !== name);
          persist(); rerenderForm();
        }
        return;
      }
      if (e.target.id === 'addSectionBtn') {
        const name = prompt('Name this new section:');
        if (!name) return;
        if (form.sections.includes(name)) { alert('A section with that name already exists.'); return; }
        form.sections.push(name);
        const id = newId('field');
        form.fields.push({ id, section: name, name: 'New field', instructions: '', type: '', units: '', definition: '', calc: '', internalVetting: '', changelog: '', origin: 'api', gridId: null, gridColIndex: null });
        focusFieldId = id;
        persist(); rerenderForm();
      }
    });

    fieldsArea.addEventListener('input', (e) => {
      const target = e.target;
      if (!(teamMode && editMode) || target.getAttribute('contenteditable') !== 'true') return;
      const text = target.textContent;
      if (target.dataset.role === 'gridSample') {
        const grid = form.grids.find(g => g.id === target.dataset.gridId);
        if (grid) grid.sample[Number(target.dataset.colIndex)] = text;
        persist();
        return;
      }
      const field = fieldById(target.dataset.id);
      if (!field) return;
      if (target.dataset.role === 'name') field.name = text;
      else if (target.dataset.role === 'spec') field[target.dataset.key] = text;
      persist();
    });

    // Paste as plain text everywhere, so pasting a bulleted/numbered list
    // (e.g. into Internal Vetting) keeps its line breaks without dragging
    // in Word/Docs formatting.
    fieldsArea.addEventListener('paste', (e) => {
      const target = e.target;
      if (target.getAttribute('contenteditable') !== 'true') return;
      e.preventDefault();
      const text = (e.clipboardData || window.clipboardData).getData('text/plain');
      document.execCommand('insertText', false, text);
    });

    renderFields();
  }

  function exportFormCsv(sensor, form) {
    const rows = [CSV_HEADERS];
    form.fields.forEach(f => {
      let table = '';
      let sample = '';
      let origin = f.origin;
      if (f.gridId) {
        const grid = form.grids.find(g => g.id === f.gridId);
        table = grid.label;
        sample = grid.sample[f.gridColIndex] || '';
        origin = grid.origin;
      }
      rows.push([
        sensor.name, form.name, f.section, table, f.name,
        origin === 'derived' ? 'Derived' : (origin === 'linked' ? 'Linked' : 'API'),
        f.instructions, f.type, f.units, f.definition, f.calc, f.internalVetting, f.changelog, sample,
      ]);
    });
    const csv = unparseCsv(rows);
    const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = form.name.toLowerCase().replace(/[^a-z0-9]+/g, '-') + '.csv';
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  }

  function renderAll() {
    document.body.classList.toggle('edit-mode', teamMode && editMode);
    renderSidebar();
    renderTopBar();
    contentEl.innerHTML = '';
    if (view.type === 'home') renderHome();
    else renderFormPage();
  }

  renderAll();
})();
</script>

</body>
</html>
